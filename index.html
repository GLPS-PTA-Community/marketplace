<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/GLPS-PTA-Community/marketplace/main/images/pta-logo.png">
  <title>PTA Community Marketplace</title>
  <style>
    /* Background wrapper to contain main content and apply background */
    .background-wrapper {
      background-color: #fdfbee;
      padding: 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
    }

    .main-wrapper {
      max-width: 1000px;
      margin: 0 auto;
    }

    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .header-box {
      background-color: #8cbb3b;
      color: white;
      padding: 20px 30px;
      border-radius: 20px;
      text-align: center;
      margin-bottom: 20px;
      animation: fadeSlideUp 0.8s ease-out forwards;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .header-box img {
      height: 60px;
      margin-bottom: 10px;
      animation: pulse 3s infinite;
    }

    .header-box h1 {
      margin: 0;
      font-size: 2em;
    }

    .add-button {
      text-align: center;
      margin-bottom: 20px;
    }

    .add-button a {
      background-color: #f57c00;
      color: white;
      padding: 12px 25px;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      font-size: 1em;
      display: inline-block;
      transition: background-color 0.3s ease;
    }
    .add-button a:hover {
      background-color: #e06c00;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select {
      padding: 10px;
      font-size: 16px;
      margin: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
      min-width: 150px;
      box-sizing: border-box;
    }

    .item-card, .skeleton-card {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin: 20px auto;
      padding: 20px;
      max-width: 600px;
      display: flex;
      gap: 15px;
      box-sizing: border-box;
    }

    .skeleton-card {
      animation: pulse 1.5s infinite ease-in-out;
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 400% 100%;
    }

    .skeleton-thumbnail {
      width: 120px;
      height: 90px;
      background-color: #ccc;
      border-radius: 8px;
    }

    .skeleton-text {
      flex: 1;
    }

    .skeleton-line {
      height: 14px;
      background-color: #ccc;
      margin-bottom: 10px;
      border-radius: 4px;
    }

    .item-details {
      flex: 1;
    }

    .item-title {
      font-size: 1.5em;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-description {
      margin-bottom: 15px;
      color: #555;
    }

    .contact-button {
      display: inline-block;
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .contact-button:hover {
      background-color: #45a049;
    }

    .thumbnail {
      width: 120px;
      height: 90px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid #8cbb3b;
      cursor: pointer;
      flex-shrink: 0;
    }

    #lightbox {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    #lightbox img {
      max-width: 90%;
      max-height: 80%;
      border-radius: 10px;
      box-shadow: 0 0 15px #000;
    }

    .badge.expiring-soon {
      background-color: #ff9800;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.9em;
    }

    /* Modal styles */
    .modal {
      display: none; 
      position: fixed; 
      z-index: 1100; 
      left: 0;
      top: 0;
      width: 100%; 
      height: 100%; 
      overflow: auto; 
      background-color: rgba(0,0,0,0.6); 
    }

    .modal-content {
      background-color: #fefefe;
      margin: 60px auto;
      padding: 20px 30px;
      border: 1px solid #888;
      width: 90%;
      max-width: 450px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
      font-size: 16px;
    }

    .modal-header {
      font-weight: bold;
      font-size: 1.4em;
      margin-bottom: 15px;
      text-align: center;
    }

    .modal-close {
      color: #aaa;
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s ease;
    }
    .modal-close:hover {
      color: #000;
    }

    .modal-group {
      margin-bottom: 15px;
    }

    .modal-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .modal-group select, .modal-group input[type="checkbox"] {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .modal-group.inline-checkboxes {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .modal-group.inline-checkboxes label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }

    .modal-footer {
      text-align: center;
      margin-top: 25px;
    }

    .modal-footer button {
      background-color: #8cbb3b;
      color: white;
      padding: 10px 25px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
      margin: 0 8px;
    }

    .modal-footer button:hover {
      background-color: #7aa92e;
    }

    /* Filter modal trigger button */
    #filterModalBtn {
      background-color: #4a90e2;
      color: white;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      font-size: 1em;
      vertical-align: middle;
      transition: background-color 0.3s ease;
    }
    #filterModalBtn:hover {
      background-color: #357ABD;
    }

    @media (max-width: 600px) {
      .background-wrapper {
        padding: 10px;
      }
      .main-wrapper {
        padding: 0 5px;
      }
      .header-box {
        padding: 15px 15px;
        border-radius: 15px;
      }
      .header-box img {
        height: 45px;
        margin-bottom: 5px;
      }
      .header-box h1 {
        font-size: 1.5em;
      }
      .add-button a {
        padding: 8px 16px;
        font-size: 0.9em;
        border-radius: 6px;
      }
      input, select {
        padding: 8px;
        font-size: 14px;
        margin: 3px 2px;
        min-width: 100px;
      }
      .item-card, .skeleton-card {
        flex-direction: column;
        max-width: 100%;
        padding: 15px;
      }
      .thumbnail {
        width: 100%;
        height: auto;
        max-height: 180px;
        border-width: 2px;
        margin-bottom: 10px;
      }
      .item-title {
        font-size: 1.2em;
      }
      .contact-button {
        padding: 8px 15px;
        font-size: 0.9em;
      }
      .badge.expiring-soon {
        font-size: 0.8em;
        padding: 2px 6px;
      }
      #filterModalBtn {
        margin-left: 0;
        margin-top: 10px;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="background-wrapper">
    <div class="main-wrapper">

      <div class="header-box">
        <img src="https://raw.githubusercontent.com/GLPS-PTA-Community/marketplace/main/images/pta-logo.png" alt="PTA Logo" />
        <h1>PTA Community Marketplace</h1>
      </div>

      <div class="add-button">
        <a href="https://docs.google.com/forms/d/e/1FAIpQLSeMm3omCNgUCGx_sx6NMYikU_JO8kWU_5S9fj2G9HG8n8DUUw/viewform" target="_blank" rel="noopener noreferrer">
          Add an Item to the Marketplace
        </a>
      </div>

      <div class="controls" aria-label="Search and filter controls">
        <input type="text" id="searchInput" placeholder="Search by item name..." aria-label="Search items by name" />
        <select id="categoryFilter" aria-label="Filter by category">
          <option value="">All Categories</option>
        </select>
        <select id="sortOrder" aria-label="Sort order">
          <option value="newest">Sort by: Newest</option>
          <option value="oldest">Sort by: Oldest</option>
        </select>
        <button id="filterModalBtn" aria-haspopup="dialog" aria-controls="filterModal" aria-expanded="false" aria-label="Open advanced filter options">Advanced Filters</button>
      </div>

      <div id="listings" aria-live="polite" aria-busy="true">
        <!-- Skeleton loaders -->
        <div class="skeleton-card" role="status" aria-label="Loading content">
          <div class="skeleton-thumbnail"></div>
          <div class="skeleton-text">
            <div class="skeleton-line" style="width: 60%;"></div>
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 40%;"></div>
          </div>
        </div>
        <div class="skeleton-card" role="status" aria-label="Loading content">
          <div class="skeleton-thumbnail"></div>
          <div class="skeleton-text">
            <div class="skeleton-line" style="width: 70%;"></div>
            <div class="skeleton-line" style="width: 90%;"></div>
            <div class="skeleton-line" style="width: 50%;"></div>
          </div>
        </div>
      </div>

      <!-- Lightbox for images -->
      <div id="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" tabindex="-1">
        <img src="" alt="Full size preview" />
      </div>

      <!-- Advanced Filter Modal -->
      <div id="filterModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="filterModalTitle" aria-hidden="true">
        <div class="modal-content">
          <span class="modal-close" role="button" aria-label="Close advanced filters">&times;</span>
          <div class="modal-header" id="filterModalTitle">Advanced Filters</div>
          <form id="filterForm" aria-describedby="filterModalDesc">
            <div id="filterModalDesc" style="font-size:0.9em; color:#555; margin-bottom:15px;">
              Select your preferred filters below and click "Apply Filters".
            </div>
            <div class="modal-group">
              <label for="modalCategoryFilter">Category</label>
              <select id="modalCategoryFilter" name="category">
                <option value="">All Categories</option>
              </select>
            </div>
            <div class="modal-group">
              <label>Condition</label>
              <div class="modal-group inline-checkboxes">
                <label><input type="checkbox" name="condition" value="New" /> New</label>
                <label><input type="checkbox" name="condition" value="Used" /> Used</label>
              </div>
            </div>
            <div class="modal-group">
              <label for="minPrice">Min Price ($)</label>
              <input type="number" id="minPrice" name="minPrice" min="0" step="0.01" placeholder="No minimum" />
            </div>
            <div class="modal-group">
              <label for="maxPrice">Max Price ($)</label>
              <input type="number" id="maxPrice" name="maxPrice" min="0" step="0.01" placeholder="No maximum" />
            </div>
            <div class="modal-group">
              <label>Expiry Status</label>
              <div class="modal-group inline-checkboxes">
                <label><input type="checkbox" name="expiryStatus" value="expired" /> Expired</label>
                <label><input type="checkbox" name="expiryStatus" value="expiringSoon" /> Expiring Soon (within 30 days)</label>
                <label><input type="checkbox" name="expiryStatus" value="valid" /> Valid (more than 30 days)</label>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" id="applyFiltersBtn">Apply Filters</button>
              <button type="button" id="clearFiltersBtn">Clear Filters</button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

<script>
  // Constants and global variables
  const listingsContainer = document.getElementById('listings');
  const searchInput = document.getElementById('searchInput');
  const categoryFilter = document.getElementById('categoryFilter');
  const sortOrderSelect = document.getElementById('sortOrder');

  // Modal elements
  const filterModal = document.getElementById('filterModal');
  const filterModalBtn = document.getElementById('filterModalBtn');
  const modalCloseBtn = filterModal.querySelector('.modal-close');
  const filterForm = document.getElementById('filterForm');
  const clearFiltersBtn = document.getElementById('clearFiltersBtn');

  // Modal filter inputs
  const modalCategoryFilter = document.getElementById('modalCategoryFilter');
  const modalConditionCheckboxes = filterForm.querySelectorAll('input[name="condition"]');
  const minPriceInput = document.getElementById('minPrice');
  const maxPriceInput = document.getElementById('maxPrice');
  const expiryStatusCheckboxes = filterForm.querySelectorAll('input[name="expiryStatus"]');

  // State to hold all listings from the API
  let allListings = [];

  // Util function to fetch listings
  async function fetchListings() {
    const url = 'https://opensheet.elk.sh/1cpRGHGu4DKS3v3D4OrUu6MrL_Q8D1qa5b7cwLcPtdAE/Items';
    try {
      const response = await fetch(url);
      if (!response.ok) throw new Error('Failed to fetch listings');
      const data = await response.json();
      return data;
    } catch (err) {
      console.error('Error fetching data:', err);
      return [];
    }
  }

  // Parse date string and return Date object or null if invalid
  function parseDate(str) {
    const date = new Date(str);
    return isNaN(date) ? null : date;
  }

  // Determine if item expires within 30 days
  function isExpiringSoon(expiryDate) {
    if (!expiryDate) return false;
    const now = new Date();
    const diffDays = (expiryDate - now) / (1000 * 60 * 60 * 24);
    return diffDays >= 0 && diffDays <= 30;
  }

  // Determine if item is expired
  function isExpired(expiryDate) {
    if (!expiryDate) return false;
    const now = new Date();
    return expiryDate < now;
  }

  // Create option elements for category dropdowns
  function populateCategoryOptions(categories) {
    // Clear current options except first
    [categoryFilter, modalCategoryFilter].forEach(selectEl => {
      selectEl.innerHTML = '<option value="">All Categories</option>';
      categories.forEach(cat => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        selectEl.appendChild(opt);
      });
    });
  }

  // Render all listings based on filters
  function renderListings(listings) {
    listingsContainer.innerHTML = '';

    if (!listings.length) {
      listingsContainer.innerHTML = '<p style="text-align:center; color:#666;">No items found matching your criteria.</p>';
      listingsContainer.setAttribute('aria-busy', 'false');
      return;
    }

    listings.forEach(item => {
      const itemCard = document.createElement('div');
      itemCard.className = 'item-card';

      // Parse expiry date
      const expiryDate = parseDate(item['Expiry Date']);
      const expired = isExpired(expiryDate);
      const expiringSoon = isExpiringSoon(expiryDate);

      // Thumbnail image with lightbox
      const img = document.createElement('img');
      img.src = item['Image URL'] || 'https://via.placeholder.com/120x90?text=No+Image';
      img.alt = item['Name'];
      img.className = 'thumbnail';
      img.tabIndex = 0;
      img.setAttribute('role', 'button');
      img.setAttribute('aria-label', `View full image of ${item['Name']}`);
      img.addEventListener('click', () => openLightbox(img.src, item['Name']));
      img.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openLightbox(img.src, item['Name']);
        }
      });

      // Details container
      const details = document.createElement('div');
      details.className = 'item-details';

      // Title with condition badge
      const title = document.createElement('h2');
      title.className = 'item-title';
      title.textContent = item['Name'];

      // Condition badge
      if (item.Condition) {
        const condBadge = document.createElement('span');
        condBadge.textContent = item.Condition;
        condBadge.style.backgroundColor = item.Condition === 'New' ? '#4caf50' : '#2196f3';
        condBadge.style.color = 'white';
        condBadge.style.padding = '3px 8px';
        condBadge.style.borderRadius = '5px';
        condBadge.style.fontSize = '0.85em';
        condBadge.style.marginLeft = '12px';
        condBadge.style.fontWeight = '600';
        title.appendChild(condBadge);
      }

      // Description
      const desc = document.createElement('p');
      desc.className = 'item-description';
      desc.textContent = item.Description;

      // Expiry badge if expiring soon or expired
      if (expired) {
        const expiredBadge = document.createElement('span');
        expiredBadge.className = 'badge expiring-soon';
        expiredBadge.textContent = 'Expired';
        expiredBadge.style.backgroundColor = '#d32f2f';
        expiredBadge.style.marginLeft = '8px';
        title.appendChild(expiredBadge);
      } else if (expiringSoon) {
        const soonBadge = document.createElement('span');
        soonBadge.className = 'badge expiring-soon';
        soonBadge.textContent = 'Expiring Soon';
        title.appendChild(soonBadge);
      }

      // Contact button
      const contactBtn = document.createElement('a');
      contactBtn.href = `mailto:${item.Email}?subject=Inquiry about ${encodeURIComponent(item['Name'])}`;
      contactBtn.className = 'contact-button';
      contactBtn.textContent = 'Contact Seller';
      contactBtn.setAttribute('aria-label', `Contact seller about ${item['Name']}`);

      // Append all
      details.appendChild(title);
      details.appendChild(desc);
      details.appendChild(contactBtn);

      itemCard.appendChild(img);
      itemCard.appendChild(details);

      listingsContainer.appendChild(itemCard);
    });

    listingsContainer.setAttribute('aria-busy', 'false');
  }

  // Filtering function that applies all filters from UI and modal
  function applyFilters() {
    let filtered = allListings;

    const searchTerm = searchInput.value.trim().toLowerCase();
    const category = categoryFilter.value;
    const sortOrder = sortOrderSelect.value;

    // Advanced modal filters
    const modalCategory = modalCategoryFilter.value;

    // Conditions checked in modal (multi-select checkboxes)
    const selectedConditions = Array.from(modalConditionCheckboxes)
      .filter(cb => cb.checked)
      .map(cb => cb.value);

    // Price range
    const minPriceVal = parseFloat(minPriceInput.value);
    const maxPriceVal = parseFloat(maxPriceInput.value);

    // Expiry statuses
    const selectedExpiryStatuses = Array.from(expiryStatusCheckboxes)
      .filter(cb => cb.checked)
      .map(cb => cb.value);

    // Search by item name
    if (searchTerm) {
      filtered = filtered.filter(item => item.Name.toLowerCase().includes(searchTerm));
    }

    // Filter by category (from main or modal filter) - modal category takes precedence if selected
    if (modalCategory) {
      filtered = filtered.filter(item => item.Category === modalCategory);
    } else if (category) {
      filtered = filtered.filter(item => item.Category === category);
    }

    // Filter by condition(s) if any selected
    if (selectedConditions.length > 0) {
      filtered = filtered.filter(item => selectedConditions.includes(item.Condition));
    }

    // Filter by price range
    filtered = filtered.filter(item => {
      let price = parseFloat(item.Price);
      if (isNaN(price)) return false; // exclude items without price or invalid price
      if (!isNaN(minPriceVal) && price < minPriceVal) return false;
      if (!isNaN(maxPriceVal) && price > maxPriceVal) return false;
      return true;
    });

    // Filter by expiry status
    if (selectedExpiryStatuses.length > 0) {
      filtered = filtered.filter(item => {
        const expiryDate = parseDate(item['Expiry Date']);
        const expired = isExpired(expiryDate);
        const expiringSoon = isExpiringSoon(expiryDate);
        const valid = !expired && !expiringSoon;

        return selectedExpiryStatuses.some(status => {
          if (status === 'expired') return expired;
          if (status === 'expiringSoon') return expiringSoon;
          if (status === 'valid') return valid;
          return false;
        });
      });
    }

    // Sort by date added (assuming the sheet has a 'Date Added' or 'Timestamp' field)
    // Since no date field specified in your sample, fallback to newest first by default
    // Or by some existing 'Date Added' or similar if present
    if (sortOrder === 'newest') {
      filtered.sort((a, b) => {
        // Attempt to parse 'Date Added' or fallback to string comparison on Name or similar
        let dateA = parseDate(a['Date Added']) || new Date(0);
        let dateB = parseDate(b['Date Added']) || new Date(0);
        return dateB - dateA;
      });
    } else if (sortOrder === 'oldest') {
      filtered.sort((a, b) => {
        let dateA = parseDate(a['Date Added']) || new Date(0);
        let dateB = parseDate(b['Date Added']) || new Date(0);
        return dateA - dateB;
      });
    }

    renderListings(filtered);
  }

  // Modal open/close handlers with accessibility
  function openModal() {
    filterModal.style.display = 'block';
    filterModal.setAttribute('aria-hidden', 'false');
    filterModalBtn.setAttribute('aria-expanded', 'true');
    // Focus first focusable element inside modal for accessibility
    filterForm.querySelector('select, input').focus();
    // Trap focus inside modal
    document.addEventListener('focus', trapFocus, true);
  }

  function closeModal() {
    filterModal.style.display = 'none';
    filterModal.setAttribute('aria-hidden', 'true');
    filterModalBtn.setAttribute('aria-expanded', 'false');
    filterModalBtn.focus();
    document.removeEventListener('focus', trapFocus, true);
  }

  // Trap focus inside modal for accessibility
  function trapFocus(event) {
    if (!filterModal.contains(event.target)) {
      event.stopPropagation();
      filterForm.querySelector('select, input').focus();
    }
  }

  // Lightbox for images
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = lightbox.querySelector('img');

  function openLightbox(src, alt) {
    lightbox.style.display = 'flex';
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightbox.focus();
  }

  function closeLightbox() {
    lightbox.style.display = 'none';
    lightboxImg.src = '';
    lightboxImg.alt = '';
  }

  // Close lightbox on click outside image or ESC
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (lightbox.style.display === 'flex') closeLightbox();
      if (filterModal.style.display === 'block') closeModal();
    }
  });

  // Populate categories based on fetched data
  function extractCategories(listings) {
    const categoriesSet = new Set();
    listings.forEach(item => {
      if (item.Category) categoriesSet.add(item.Category);
    });
    return Array.from(categoriesSet).sort();
  }

  // Initialize page
  async function init() {
    listingsContainer.setAttribute('aria-busy', 'true');
    allListings = await fetchListings();

    // Extract and populate category options
    const categories = extractCategories(allListings);
    populateCategoryOptions(categories);

    // Initially render all listings
    applyFilters();

    // Remove skeleton loaders
    // (already replaced by renderListings)

    // Event listeners for filters
    searchInput.addEventListener('input', () => applyFilters());
    categoryFilter.addEventListener('change', () => applyFilters());
    sortOrderSelect.addEventListener('change', () => applyFilters());

    // Modal open/close
    filterModalBtn.addEventListener('click', () => {
      if (filterModal.style.display === 'block') {
        closeModal();
      } else {
        openModal();
      }
    });
    modalCloseBtn.addEventListener('click', closeModal);

    // Close modal on clicking outside modal content
    filterModal.addEventListener('click', (e) => {
      if (e.target === filterModal) closeModal();
    });

    // Handle modal form submit (apply filters)
    filterForm.addEventListener('submit', (e) => {
      e.preventDefault();
      applyFilters();
      closeModal();
    });

    // Clear filters button
    clearFiltersBtn.addEventListener('click', () => {
      filterForm.reset();
      applyFilters();
      closeModal();
    });
  }

  // Run init on page load
  window.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
